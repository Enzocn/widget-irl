mkdir -p ~/overlay-hub/public && cat > ~/overlay-hub/public/overlay.html << 'OVERLAYEOF'
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Overlay - enzocn_</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body {
    margin: 0;
    background: transparent;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- Colunas laterais (logo, clima, contador) ---------- */
  .stack {
    position: fixed;
    top: 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
  }
  .stack.left  { left: 40px; align-items: flex-start; }
  .stack.right { right: 40px; align-items: flex-end; }

  /* ---------- Logo ---------- */
  #logo-wrap { display: none; }
  #logo-wrap.show { display: block; }
  #logo-img {
    max-width: 220px;
    display: block;
    animation: pulse 2.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* ---------- Widget clima/data/hora ---------- */
  #irl-widget {
    display: none;
    flex-direction: column;
    font-size: 22px;
    background-color: rgba(60, 60, 60, 0.7);
    padding: 10px 14px;
    border-radius: 8px;
  }
  #irl-widget.show { display: flex; }
  .widget-item { display: flex; align-items: center; margin-bottom: 5px; line-height: 1; }
  .widget-item:last-child { margin-bottom: 0; }
  .icon { display: inline-flex; align-items: center; justify-content: center; margin-right: 10px; width: 28px; height: 28px; color: #fff; }
  .icon svg { width: 100%; height: 100%; }
  .small-text { font-size: 19px; }

  /* ---------- Contador de plataforma(s) ao vivo ---------- */
  #viewer-badge {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #viewer-badge.show { display: flex; }
  .badge-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 18px;
    color: #fff;
  }
  .badge-pill .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .badge-twitch  { background: rgba(100, 65, 165, 0.85); }
  .badge-kick    { background: rgba(83, 252, 24, 0.85); color:#062b00; }
  .badge-youtube { background: rgba(255, 0, 0, 0.85); }

  /* ---------- QR code (imagem fixa) ---------- */
  #qrcode-wrap {
    display: none;
    background: #fff;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  #qrcode-wrap.show { display: block; }
  #qrcode-img { display: block; width: 160px; height: 160px; }

  /* ---------- GPS: caixinha de mapa no canto inferior (esquerda ou direita) ---------- */
  #gps-wrap {
    position: fixed;
    bottom: 40px;
    width: 360px;
    height: 240px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 14px rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.25);
    z-index: 10;
    display: none;
  }
  #gps-wrap.show { display: block; }
  #gps-wrap.left  { left: 40px; }
  #gps-wrap.right { right: 40px; }
  #gps-map { width: 100%; height: 100%; }
  .device-wrap { display: flex; flex-direction: column; align-items: center; }
  .device-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.7);
  }
  .device-label {
    margin-top: 2px;
    background: rgba(0,0,0,0.65); color: #fff; padding: 1px 6px; border-radius: 4px;
    font: 600 10px/1.3 sans-serif; white-space: nowrap;
  }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
</style>
</head>
<body>

  <div class="stack left"  id="stack-left"></div>
  <div class="stack right" id="stack-right"></div>

  <!-- Templates dos widgets de coluna (movidos via JS para left/right) -->
  <div id="logo-wrap"><img id="logo-img" src="/logo.png" alt="logo" /></div>

  <div id="irl-widget"></div>

  <div id="qrcode-wrap"><img id="qrcode-img" src="/qrcode.png" alt="QR code" /></div>

  <div id="viewer-badge"></div>

  <!-- GPS -->
  <div id="gps-wrap"><div id="gps-map"></div></div>

<script>
  // Cenas do OBS em que o GPS pode aparecer. Ajuste aqui se os nomes das
  // cenas mudarem (ex: se voce renomear "LOW" pra outra coisa no futuro).
  const GPS_ALLOWED_SCENES = ['LIVE', 'LOW'];

  // ---------- Weather/data/hora (buscado via nosso servidor, sem chave exposta no navegador) ----------
  let lastWeatherFetch = 0;
  let cachedWeatherHtml = '';

  function formatDate(date) {
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = date.getFullYear();
    return `${d}/${m}/${y}`;
  }
  function calendarSVG() {
    return `<span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect><path d="M16 3v4M8 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1"></line></svg></span>`;
  }
  function clockSVG() {
    return `<span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M12 7v6l4 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>`;
  }
  function weatherEmoji(code) {
    const map = { '01d':'☀️','01n':'🌙','02d':'🌤️','02n':'☁️','03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️','09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️','11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️','50d':'🌫️','50n':'🌫️' };
    return map[code] || '❓';
  }
  async function getWeatherHtml(show) {
    if (!show) return '';
    const now = Date.now();
    if (now - lastWeatherFetch < 5 * 60 * 1000 && cachedWeatherHtml) return cachedWeatherHtml;
    try {
      const resp = await fetch('/api/weather', { cache: 'no-store' });
      const data = await resp.json();
      if (data && !data.error) {
        cachedWeatherHtml = `<div class="widget-item"><span class="icon">${weatherEmoji(data.icon)}</span><span class="small-text">${data.temp}°C</span></div>`;
        lastWeatherFetch = now;
      }
    } catch (e) { console.error('erro clima', e); }
    return cachedWeatherHtml;
  }
  async function renderWeatherWidget(cfg) {
    const el = document.getElementById('irl-widget');
    let html = '';
    html += await getWeatherHtml(cfg.showWeather);
    if (cfg.showDate) html += `<div class="widget-item">${calendarSVG()}<span class="small-text">${formatDate(new Date())}</span></div>`;
    if (cfg.showTime) html += `<div class="widget-item">${clockSVG()}<span class="small-text">${new Date().toLocaleTimeString('pt-BR', { hour12: false })}</span></div>`;
    el.innerHTML = html;
  }

  // ---------- Contador: um pill por plataforma ativa no momento ----------
  function renderViewerBadge(cfg, live) {
    const el = document.getElementById('viewer-badge');
    const platforms = (live && live.platforms) || [];
    if (!cfg.visible || !platforms.length) {
      el.classList.remove('show');
      el.innerHTML = '';
      return;
    }
    el.classList.add('show');
    const names = { twitch: 'TWITCH', kick: 'KICK', youtube: 'YOUTUBE' };
    el.innerHTML = platforms
      .map((p) => `<div class="badge-pill badge-${p}"><span class="dot"></span><span>${names[p] || p.toUpperCase()}</span></div>`)
      .join('');
  }

  // ---------- QR code (imagem fixa, com ciclo opcional 10s on / 1min off) ----------
  let qrCycleTimer = null;
  let qrCycleActive = false;

  function stopQrCycle() {
    if (qrCycleTimer) clearTimeout(qrCycleTimer);
    qrCycleTimer = null;
    qrCycleActive = false;
  }

  function startQrCycle() {
    if (qrCycleActive) return;
    qrCycleActive = true;
    const el = document.getElementById('qrcode-wrap');
    function showThenHide() {
      el.classList.add('show');
      qrCycleTimer = setTimeout(() => {
        el.classList.remove('show');
        qrCycleTimer = setTimeout(showThenHide, 60000);
      }, 10000);
    }
    showThenHide();
  }

  function applyQrState(cfg) {
    placeInStack('qrcode-wrap', cfg.side);
    const el = document.getElementById('qrcode-wrap');
    if (!cfg.visible) {
      stopQrCycle();
      el.classList.remove('show');
      return;
    }
    if (cfg.cycle) {
      startQrCycle();
    } else {
      stopQrCycle();
      el.classList.add('show');
    }
  }

  // ---------- Monta as colunas esquerda/direita respeitando side de cada widget ----------
  function placeInStack(elId, side) {
    const target = document.getElementById('stack-' + side);
    const el = document.getElementById(elId);
    if (target && el.parentElement !== target) target.appendChild(el);
  }

  // =====================================================================
  // GPS: mapa no canto inferior, 1 ou mais celulares, rota opcional
  // =====================================================================
  let gpsMap = null, gpsMarkers = {}, gpsTrailData = {}, gpsInited = false, gpsWsConnected = false;

  function emptyFC() { return { type: 'FeatureCollection', features: [] }; }

  async function initGpsMap() {
    if (gpsInited) return;
    gpsInited = true;
    const cfg = await (await fetch('/api/gps/config')).json();
    if (!cfg.maptilerKey) { console.error('GPS: MAPTILER_KEY nao configurada'); return; }

    gpsMap = new maplibregl.Map({
      container: 'gps-map',
      style: `https://api.maptiler.com/maps/satellite/style.json?key=${cfg.maptilerKey}`,
      center: [-46.63, -23.55],
      zoom: 15,
      attributionControl: false,
      interactive: false
    });

    gpsMap.on('load', async () => {
      gpsMap.addSource('gps-route', { type: 'geojson', data: emptyFC() });
      gpsMap.addLayer({
        id: 'gps-route-line', type: 'line', source: 'gps-route',
        paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-dasharray': [2, 2] }
      });

      const state = await (await fetch('/api/gps/state')).json();
      Object.entries(state.devices).forEach(([id, d]) => {
        gpsTrailData[id] = (d.trail || []).slice();
        updateGpsDevice(id, d.point, d.color, d.label);
      });
      if (state.route) setGpsRoute(state.route);

      fitGpsView();
      connectGpsWs();
    });
  }

  function fitGpsView() {
    const pts = Object.values(gpsTrailData).flat();
    if (!pts.length) return;
    if (pts.length === 1) {
      gpsMap.setCenter([pts[0].lon, pts[0].lat]);
      return;
    }
    const lons = pts.map(p => p.lon), lats = pts.map(p => p.lat);
    gpsMap.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: 30, maxZoom: 17, duration: 0 });
  }

  function connectGpsWs() {
    if (gpsWsConnected) return;
    gpsWsConnected = true;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'gps-position') {
        if (!gpsTrailData[msg.device_id]) gpsTrailData[msg.device_id] = [];
        gpsTrailData[msg.device_id].push(msg.point);
        if (gpsTrailData[msg.device_id].length > 300) gpsTrailData[msg.device_id].shift();
        updateGpsDevice(msg.device_id, msg.point, msg.color, msg.label);
      } else if (msg.type === 'gps-route') {
        setGpsRoute(msg.route);
      } else if (msg.type === 'gps-device' && gpsMarkers[msg.device_id]) {
        gpsMarkers[msg.device_id].labelEl.textContent = msg.label;
      }
    };
    ws.onclose = () => { gpsWsConnected = false; setTimeout(connectGpsWs, 2000); };
  }

  function updateGpsDevice(id, point, color, label) {
    if (!point || !gpsMap) return;

    if (!gpsMarkers[id]) {
      const wrap = document.createElement('div');
      wrap.className = 'device-wrap';
      const dot = document.createElement('div');
      dot.className = 'device-dot';
      dot.style.background = color || '#ff4d4d';
      const labelEl = document.createElement('div');
      labelEl.className = 'device-label';
      labelEl.textContent = label || id;
      wrap.appendChild(dot);
      wrap.appendChild(labelEl);
      const marker = new maplibregl.Marker({ element: wrap }).setLngLat([point.lon, point.lat]).addTo(gpsMap);
      gpsMarkers[id] = marker;
      gpsMarkers[id].labelEl = labelEl;
    } else {
      gpsMarkers[id].setLngLat([point.lon, point.lat]);
    }

    const trailId = `gps-trail-${id}`;
    const pts = gpsTrailData[id] && gpsTrailData[id].length ? gpsTrailData[id] : [point];
    const geojson = { type: 'Feature', geometry: { type: 'LineString', coordinates: pts.map((p) => [p.lon, p.lat]) } };
    if (!gpsMap.getSource(trailId)) {
      gpsMap.addSource(trailId, { type: 'geojson', data: geojson });
      gpsMap.addLayer({ id: trailId, type: 'line', source: trailId, paint: { 'line-color': color || '#ff4d4d', 'line-width': 2, 'line-opacity': 0.85 } }, 'gps-route-line');
    } else {
      gpsMap.getSource(trailId).setData(geojson);
    }
  }

  function setGpsRoute(route) {
    if (!gpsMap || !gpsMap.getSource('gps-route')) return;
    gpsMap.getSource('gps-route').setData(route ? route.geojson : emptyFC());
  }

  // GPS so aparece se: o widget estiver ligado no painel E a cena atual do
  // OBS for LIVE ou LOW E tiver pelo menos 1 celular mandando posicao.
  function applyGpsState(cfg, currentScene, activeDevices) {
    const wrap = document.getElementById('gps-wrap');
    const allowedByScene = GPS_ALLOWED_SCENES.includes(currentScene);
    const hasDevice = (activeDevices || 0) > 0;
    const shouldShow = cfg.visible && allowedByScene && hasDevice;

    wrap.classList.toggle('show', shouldShow);
    wrap.classList.remove('left', 'right');
    wrap.classList.add(cfg.side);

    if (shouldShow) {
      initGpsMap();
      if (gpsMap) setTimeout(() => gpsMap.resize(), 50);
    }
  }

  async function applyState(state) {
    // Logo
    placeInStack('logo-wrap', state.logo.side);
    document.getElementById('logo-wrap').classList.toggle('show', state.logo.visible);

    // Clima / data / hora
    placeInStack('irl-widget', state.weather.side);
    document.getElementById('irl-widget').classList.toggle('show', state.weather.visible);
    if (state.weather.visible) await renderWeatherWidget(state.weather);

    // QR code
    applyQrState(state.qrcode);

    // Contador de plataforma
    placeInStack('viewer-badge', state.viewerCounter.side);
    renderViewerBadge(state.viewerCounter, state.live);

    // GPS (agora depende tambem da cena atual do OBS e de ter celular ativo)
    applyGpsState(state.gps, state.currentScene, state.gpsActiveDevices);
  }

  let currentState = null;

  async function poll() {
    try {
      const resp = await fetch('/api/state', { cache: 'no-store' });
      currentState = await resp.json();
      await applyState(currentState);
    } catch (e) {
      console.error('erro buscando estado', e);
    }
  }

  // relogio/data atualizam a cada segundo, sem esperar o poll do servidor
  setInterval(() => {
    if (currentState && currentState.weather.visible) renderWeatherWidget(currentState.weather);
  }, 1000);

  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
OVERLAYEOF
